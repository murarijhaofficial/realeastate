services:
  - type: web
    name: estatedesk-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile
    preDeployCommand: pnpm --filter @estatedesk/backend db:migrate
    startCommand: pnpm --filter @estatedesk/backend start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estatedesk-db
          property: connectionString
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        value: https://frontend-iota-blush-77.vercel.app
      - key: HOLD_DURATION_MINUTES
        value: "30"

databases:
  - name: estatedesk-db
    databaseName: realestate_crm
    user: estatedesk
    plan: basic-256mb
